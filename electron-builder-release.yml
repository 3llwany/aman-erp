appId: com.aman.erp
productName: AMAN ERP
executableName: AMAN ERP
artifactName: AMAN ERP Setup.exe
directories:
  output: release-fullscreen
files:
  - electron/**/*
  - index.html.html
  - src/**/*
  - database/**/*
  - services/**/*
  - security/**/*
  - backup/**/*
  - assets/**/*
  - package.json
icon: assets/aman-erp.ico
asar: true
win:
  icon: assets/aman-erp.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  installerIcon: assets/aman-erp.ico
  uninstallerIcon: assets/aman-erp.ico
  installerHeaderIcon: assets/aman-erp.ico
