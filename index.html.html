    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"

    <style>
      :root {
        --p: #957047;
        --p2: #7b5738;
        --bg: #f5eee7;
        --sb: #382318;
        --sbt: #bd8b5c;
        --rd: #b84b42;
        --gn: #5f8a58;
        --amb: #b8793f;
        --bd: #e2d6cb;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Tajawal", Tahoma, Arial, sans-serif;
        background: var(--bg);
        color: #30231c;
        font-size: 14px;
        overflow-y: scroll;
        scrollbar-gutter: stable;
      }
      a {
        color: var(--p);
        cursor: pointer;
        text-decoration: none;
      }
      h3 {
        margin: 0 0 10px;
      }
      .sb {
        position: fixed;
        top: 0;
        bottom: 0;
        inset-inline-start: 0;
        width: 230px;
        background: var(--sb);
        color: #fff;
        overflow-y: scroll;
        scrollbar-gutter: stable;
        z-index: 40;
        transition: none;
      }
      .sb .logo {
        padding: 14px;
        font-weight: 500;
        font-size: 17px;
        background: rgba(0, 0, 0, 0.18);
        letter-spacing: 0.5px;
      }
      .sb .grp {
        padding: 8px 12px 4px;
        color: var(--sbt);
        font-size: 11px;
        font-weight: 400;
      }
      .sb a.ni {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 7px 12px;
        color: #f8eee5;
        border-radius: 8px;
        margin: 1px 6px;
        font-size: 13px;
        font-weight: 400;
        transition: none;
        transform: none;
      }
      .sb a.ni:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .sb a.ni:focus,
      .sb a.ni:active,
      .sb a.ni:visited {
        text-decoration: none !important;
        text-decoration-line: none !important;
        border-bottom: 0;
        outline: none;
        box-shadow: none;
      }
      .sb a.ni.on {
        background: var(--p);
        color: #fff8f1;
      }
      .sb a.ni.lk {
        opacity: 0.45;
      }
      .mn {
        margin-inline-start: 230px;
        padding: 0;
      }
      .tb {
        position: sticky;
        top: 0;
        z-index: 30;
        background: #fff;
        border-bottom: 1px solid var(--bd);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
      }
      .tb .ttl {
        font-weight: 800;
        font-size: 16px;
        flex: 1;
      }
      .chip {
        background: var(--p);
        color: #fff;
        border-radius: 20px;
        padding: 3px 12px;
        font-size: 12px;
      }
      .ct {
        padding: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .kpi {
        background: #fff;
        border: 1px solid var(--bd);
        border-inline-start: 4px solid var(--p);
        border-radius: 10px;
        padding: 12px;
      }
      .kpi .v {
        font-size: 20px;
        font-weight: 800;
        margin-top: 4px;
      }
      .kpi .l {
        color: #64748b;
        font-size: 12px;
      }
      table.tb2 {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      .tb2 th {
        background: #fbf7f3;
        color: #6e5542;
        font-size: 12px;
        text-align: start;
        padding: 8px;
        border-bottom: 2px solid var(--bd);
      }
      .tb2 td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--bd);
        font-size: 13px;
      }
      .tb2 tr:hover td {
        background: #f8fafc;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 7px 14px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .btn:hover {
        border-color: var(--p);
        color: var(--p);
      }
      .btnP {
        background: var(--p);
        border-color: var(--p);
        color: #fff;
      }
      .btnP:hover {
        background: var(--p2);
        color: #fff;
      }
      .btnD {
        background: var(--rd);
        border-color: var(--rd);
        color: #fff;
      }
      .btnS {
        background: var(--gn);
        border-color: var(--gn);
        color: #fff;
      }
      .btnW {
        background: var(--amb);
        border-color: var(--amb);
        color: #fff;
      }
      .btn.sm {
        padding: 3px 9px;
        font-size: 12px;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 13px;
        padding: 8px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        width: 100%;
        background: #fff;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #d4b99b;
        border-color: var(--p);
      }
      .frm {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }
      .frm .fw {
        grid-column: 1/-1;
      }
      .fld label {
        display: block;
        font-size: 12px;
        color: #475569;
        margin-bottom: 4px;
        font-weight: 600;
      }
      .mdl {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(2, 32, 30, 0.55);
        z-index: 90;
        align-items: flex-start;
        justify-content: center;
        padding: 30px 12px;
        overflow: auto;
      }
      .mdl .bx {
        background: #fff;
        border-radius: 12px;
        width: min(860px, 100%);
        padding: 16px;
        animation: pop 0.18s;
      }
      @keyframes pop {
        from {
          transform: translateY(12px);
          opacity: 0;
        }
      }
      .mdl h3 {
        border-bottom: 1px solid var(--bd);
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .tst {
        position: fixed;
        bottom: 18px;
        inset-inline-end: 18px;
        background: #0f172a;
        color: #fff;
        padding: 11px 18px;
        border-radius: 10px;
        z-index: 200;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        animation: pop 0.2s;
        max-width: 340px;
      }
      .tst.err {
        background: var(--rd);
      }
      .bdg {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
      }
      .bdg.g {
        background: #dcfce7;
        color: #166534;
      }
      .bdg.y {
        background: #fef3c7;
        color: #92400e;
      }
      .bdg.r {
        background: #fee2e2;
        color: #991b1b;
      }
      .bdg.b {
        background: #dbeafe;
        color: #1e40af;
      }
      .auth {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #382318, #6f4b31);
      }
      .auth .bx {
        background: #fff;
        border-radius: 14px;
        padding: 26px;
        width: min(430px, 94vw);
      }
      .auth h1 {
        font-size: 22px;
        color: var(--p2);
        text-align: center;
        margin-bottom: 2px;
      }
      .auth .sub {
        text-align: center;
        color: #64748b;
        font-size: 12px;
        margin-bottom: 16px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        border-bottom: 2px solid var(--bd);
        margin-bottom: 14px;
      }
      .tabs a {
        padding: 8px 14px;
        font-weight: 700;
        color: #64748b;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
      }
      .tabs a.on {
        color: var(--p);
        border-color: var(--p);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .mut {
        color: #64748b;
        font-size: 12px;
      }
      .hint {
        background: #fffbeb;
        border: 1px solid #fde68a;
        color: #92400e;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        margin-bottom: 12px;
      }
      .posGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }
      .posIt {
        background: #fff;
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
        text-align: center;
      }
      .posIt:hover {
        border-color: var(--p);
        box-shadow: 0 3px 10px rgba(15, 118, 110, 0.15);
      }
      .permGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 4px;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 8px;
      }
      .permGrid label {
        font-size: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #burger {
        display: none;
      }
      @media (max-width: 900px) {
        .sb {
          transform: translateX(100%);
        }
        [dir="ltr"] .sb {
          transform: translateX(-100%);
        }
        .sb.open {
          transform: none;
        }
        .mn {
          margin: 0;
        }
        #burger {
          display: inline-flex;
        }
      }
      .hamb {
        position: fixed;
        bottom: 14px;
        inset-inline-start: 14px;
        z-index: 50;
        display: none;
      }
      @media (max-width: 900px) {
        .hamb {
          display: inline-flex;
        }
      }
    </style>
  </head>

                      } else if (entityName === "Project") {
                        m.number = item.id || "";
                      } else if (entityName === "Rental") {
                        m.number = item.id || "";
                        m.partyId = item.party || "";
                        m.startDate = item.start ? new Date(item.start) : new Date();
                        m.endDate = item.end ? new Date(item.end) : undefined;
                      } else if (entityName === "Installment") {
                        m.number = item.id || "";
                        m.partyType = "customer";
                        m.partyId = item.party || "";
                      } else if (entityName === "Task") {
                        m.number = item.id || "";
                        m.dueDate = item.due ? new Date(item.due) : undefined;
                      } else if (entityName === "Budget") {
                        m.accountCode = item.acc || "";
                      } else if (entityName === "RecurringTransaction") {
                        m.number = item.id || "";
                        m.debitAccountCode = item.drAcc || "";
                        m.creditAccountCode = item.crAcc || "";
                        m.nextRun = item.next ? new Date(item.next) : new Date();
                      } else if (entityName === "ManufacturingOrder") {
                        m.number = item.id || "";
                        m.productId = item.bomId || "";
                        m.quantity = item.qty ?? 1;
                      }
                      return m;
                    });
                    await window.amanDesktop.db.bulkInsert(entityName, mapped);
                  }
                } catch (e) {
                  console.warn("Migration item skipped:", key, e);
                }
              }
            }
          }

          localStorage.setItem(migratedKey, new Date().toISOString());
          console.log("✅ Comprehensive Realm Database migration completed successfully!");

      /* ---------------- Ledger helpers ---------------- */
      function accs() {
        return DB.g("accounts", []);
      }
      function accName(c) {
        const a = accs().find((x) => x.code === c);
        return a ? (LANG === "ar" ? a.name : a.en) : c;
      }
      function accOpts(sel, leafOnly = true) {
        return accs()
          .filter((a) => !leafOnly || a.lv === "d")
          .map(
            (a) =>
              `<option value="${a.code}" ${sel === a.code ? "selected" : ""}>${a.code} — ${esc(LANG === "ar" ? a.name : a.en)}</option>`,
          )
          .join("");
      }
      function jrn() {
        return DB.g("journal", []).filter((j) => j.status === "posted");
      }
      function accSums(code) {
        let dr = 0,
          cr = 0;
        jrn().forEach((j) =>
          j.lines.forEach((l) => {
            if (l.accCode === code) {
              dr += +l.dr || 0;
              cr += +l.cr || 0;
            }
          }),
        );
        return { dr, cr };
      }
      function obMap() {
        return DB.g("ob", {});
      }
      function accBal(code) {
        const a = accs().find((x) => x.code === code);
        if (!a) return 0;
        const ob = obMap()[code] || 0,
          { dr, cr } = accSums(code);
        const debitNat = a.type === "asset" || a.type === "expense";
        return r2(debitNat ? ob + dr - cr : ob + cr - dr);
      }
      function typeSum(type) {
        return r2(
          accs()
            .filter((a) => a.lv === "d" && a.type === type)
            .reduce((s, a) => s + accBal(a.code), 0),
        );
      }
      function postJournal(desc, lines, status = "posted") {
        const j = DB.g("journal", []);
        const dr = r2(lines.reduce((s, l) => s + (+l.dr || 0), 0)),
          cr = r2(lines.reduce((s, l) => s + (+l.cr || 0), 0));
        if (Math.abs(dr - cr) > 0.01) {
          toast(t("notBalanced"), 1);
          return null;
        }
        const e = {
          id: nextId("JV-", j, 4),
          date: today(),
          desc,
          status,
          dr,
          cr,
          lines: lines.map((l) => ({
            accCode: l.accCode,
            accName: accName(l.accCode),
            dr: +l.dr || 0,
            cr: +l.cr || 0,
          })),
        };
        j.push(e);
        DB.s("journal", j);
        return e;
      }

          const k = localStorage.key(i);

            const c = k.slice(4, -6);

      /* ---------- Financial statements engine ---------- */
      function getBSData() {
        const grp = (tp) =>
          accs()
            .filter((a) => a.lv === "d" && a.type === tp)
            .map((a) => ({
              n: LANG === "ar" ? a.name : a.en,
              v: accBal(a.code),
            }))
            .filter((x) => Math.abs(x.v) > 0.001);
        const rev = typeSum("revenue"),
          exp = typeSum("expense"),
          np = r2(rev - exp);
        const assets = grp("asset"),
          liab = grp("liability"),
          eq = grp("equity");
        const ta = r2(assets.reduce((s, x) => s + x.v, 0)),
          tl = r2(liab.reduce((s, x) => s + x.v, 0)),
          te = r2(eq.reduce((s, x) => s + x.v, 0) + np);
        return {
          assets,
          liab,
          equity: eq,
          netProfit: np,
          ta,
          tl,
          te,
          balanced: Math.abs(ta - (tl + te)) < 0.01,
        };
      }
      function getISData() {
        const grp = (tp) =>
          accs()
            .filter((a) => a.lv === "d" && a.type === tp)
            .map((a) => ({
              n: LANG === "ar" ? a.name : a.en,
              v: accBal(a.code),
            }))
            .filter((x) => Math.abs(x.v) > 0.001);
        const rev = grp("revenue"),
          exp = grp("expense");
        return {
          rev,
          exp,
          tr: r2(rev.reduce((s, x) => s + x.v, 0)),
          te: r2(exp.reduce((s, x) => s + x.v, 0)),
          net: 0,
          get netProfit() {
            return r2(this.tr - this.te);
          },
        };
      }
      function getCFData() {
        const cash = "1101";
        const rows = [];
        jrn().forEach((j) =>
          j.lines.forEach((l) => {
            if (l.accCode === cash)
              rows.push({ d: j.date, ds: j.desc, inn: l.dr, out: l.cr });
          }),
        );
        const inn = r2(rows.reduce((s, x) => s + x.inn, 0)),
          out = r2(rows.reduce((s, x) => s + x.out, 0));
        return { rows, inn, out, net: r2(inn - out), open: obMap()[cash] || 0 };
      }
      function bsHTML() {

 <div style="margin-top:8px">${b.balanced ? `<span class="bdg g">${t("balanced")}</span>` : `<span class="bdg r">${t("notBalanced")}</span>`}</div>`;
      }
      function isHTML() {

        return `<table class="tb2"><tr><td colspan=2 style="font-weight:800;background:#f0fdfa">${t("revenue")}</td></tr>${i.rev.map((x) => `<tr><td style="padding-inline-start:20px">${esc(x.n)}</td><td>${fmt(x.v)}</td></tr>`).join("")}<tr style="font-weight:700"><td>${t("grandTotal")}</td><td>${fmt(i.tr)}</td></tr>
 <tr><td colspan=2 style="font-weight:800;background:#fef2f2">${t("expenses")}</td></tr>${i.exp.map((x) => `<tr><td style="padding-inline-start:20px">${esc(x.n)}</td><td>${fmt(x.v)}</td></tr>`).join("")}<tr style="font-weight:700"><td>${t("grandTotal")}</td><td>${fmt(i.te)}</td></tr>
 <tr style="font-weight:800;background:#f0fdfa"><td>${t("netProfit")}</td><td>${fmt(r2(i.tr - i.te))}</td></tr></table>`;

      function cfHTML() {

 <tr style="font-weight:800"><td colspan=2>${t("net")} (${t("opening")}: ${fmt(c.open)})</td><td>${fmt(c.inn)}</td><td>${fmt(c.out)}</td></tr></table>`;

      function stmtCSV(k) {

      PG.reports = {
        k: "reports",

 <td><input type="number" step="0.01" id="${pre}D${i}" value="${it.disc || 0}" style="width:70px" oninput="${pre}Calc('${pre}')"></td>

 <td id="${pre}L${i}">0</td><td><button class="btn sm btnD" onclick="this.closest('tr').remove();${pre}Calc('${pre}')">✕</button></td></tr>`;
      }
      let sLn = 1;
      function sAddRow(pre) {
        const tb = q(pre + "B");

        d.innerHTML = saleLineRow({}, sLn++, pre);

      function sPick(i, pre) {
        const it = DB.g("inv", []).find((x) => x.id === q(pre + "I" + i).value);
        if (it) {
          q(pre + "N" + i).value = it.name;
          q(pre + "P" + i).value = it.price;
        }
        sCalc(pre);
      }
      function sCalc(pre) {
        let sub = 0,
          disc = 0,
          vat = 0;
        const rows = q(pre + "B").querySelectorAll("tr");
        rows.forEach((r, i) => {
          const qEl = q(pre + "Q" + i);
          if (!qEl) return;
          const qty = +qEl.value || 0,
            pr = +q(pre + "P" + i).value || 0,
            ds = +q(pre + "D" + i).value || 0,
            vr = +q(pre + "V" + i).value || 0;
          const gross = qty * pr,
            dA = (gross * ds) / 100,
            net = gross - dA,
            vA = (net * vr) / 100,
            tot = net + vA;
          const lc = q(pre + "L" + i);
          if (lc) lc.textContent = fmt(r2(tot));
          sub += gross;
          disc += dA;
          vat += vA;
        });
        const tEl = q(pre + "T");
        if (tEl) tEl.textContent = fmt(r2(sub - disc + vat));
        const s1 = q(pre + "S");
        if (s1) {
          s1.textContent = fmt(r2(sub - disc));
          q(pre + "V").textContent = fmt(r2(vat));
        }
      }
      function readLines(pre) {
        const items = [];
        const rows = q(pre + "B").querySelectorAll("tr");

          const qEl = q(pre + "Q" + i);
          if (!qEl) return;
          const name = q(pre + "N" + i).value.trim();
          if (!name) return;
          const qty = +qEl.value || 0,
            price = +q(pre + "P" + i).value || 0,
            disc = +q(pre + "D" + i).value || 0,
            vatRate = +q(pre + "V" + i).value || 0;
          const gross = r2(qty * price),
            discAmt = r2((gross * disc) / 100),
            amt = r2(gross - discAmt),
            vatAmt = r2((amt * vatRate) / 100);
          items.push({
            invId: q(pre + "I" + i).value,
            name,
            qty,
            price,
            disc,
            vatRate,
            unit: "",
            gross,
            discAmt,
            amt,
            vatAmt,
            total: r2(amt + vatAmt),
          });
        });
        return items;
      }
      function commitSaleDoc(ent, custId, date, items, cash) {
        const list = DB.g(ent, []);

          name: t("cashCustomer"),
        };
        const doc = {
          id: nextId(ent === "sales" ? "S-" : "QU-", list, 4),
          custId,
          custName: cust.name,
          date,
          createdAt: new Date().toISOString(),
          items,
          sub,
          vat,
          total: tot,
        };
        list.push(doc);
        DB.s(ent, list);
        if (ent === "sales") {
          const inv = DB.g("inv", []);

 ${l.map((x) => `<tr>${cols.map((c) => `<td>${c.r ? c.r(x) : esc(x[c.k] ?? "")}</td>`).join("")}<td>${crudXtra(ent, x)}<button class="btn sm btnD" onclick="crudDel('${ent}','${x.id}')">🗑</button></td></tr>`).join("") || `<tr><td colspan="${cols.length + 1}" class="mut">${t("noData")}</td></tr>`}</table></div>`;

        if (ent === "tasks")

            : "";

          return `<button class="btn sm btnW" onclick="recRun('${x.id}')">▶ ${t("runNow")}</button> `;
        return "";

              return `<div class="fld"><label>${t(fl.l) || fl.l}</label><input type="${fl.t || "text"}" id="cf_${fl.k}" ${fl.t === "number" ? 'step="0.01"' : ""}></div>`;

            .join("")}</div>`,

        );

      function crudSave(ent) {
        const f = window._CFGS[ent],
          l = DB.g(ent, []);

        for (const fl of f) {

          if (fl.req && !v) return toast(t("noData"), 1);
          o[fl.k] = fl.t === "number" ? +v : v;

        if (ent === "tasks") {
          o.status = "pending";

 ${s.map((x) => `<tr><td>${x.id}</td><td>${x.date}</td><td>${money(x.sub)}</td><td>${money(x.vat)}</td></tr>`).join("") || `<tr><td colspan=4 class="mut">${t("noData")}</td></tr>`}
 <tr style="font-weight:800"><td colspan=2>${t("grandTotal")}</td><td>${money(r2(s.reduce((a, x) => a + x.sub, 0)))}</td><td>${money(r2(s.reduce((a, x) => a + x.vat, 0)))}</td></tr></table></div>
 <div class="card"><h3>${t("purchases")}</h3><table class="tb2"><tr><th>${t("code")}</th><th>${t("date")}</th><th>${t("subtotal")}</th><th>${t("vatAmt")}</th></tr>
 ${p.map((x) => `<tr><td>${x.id}</td><td>${x.date}</td><td>${money(x.sub)}</td><td>${money(x.vat)}</td></tr>`).join("") || `<tr><td colspan=4 class="mut">${t("noData")}</td></tr>`}
 <tr style="font-weight:800"><td colspan=2>${t("grandTotal")}</td><td>${money(r2(p.reduce((a, x) => a + x.sub, 0)))}</td><td>${money(r2(p.reduce((a, x) => a + x.vat, 0)))}</td></tr></table></div>`;
        },
      };
      PG.payroll_report = {
        k: "payroll_report",
        f() {
          return (
            DB.g("payroll_runs", [])
              .slice()
              .reverse()
              .map(
                (
                  r,
                ) => `<div class="card"><b>${r.id} — ${r.period}</b> · ${t("net")}: <b>${money(r.totNet)}</b>
 <table class="tb2" style="margin-top:8px"><tr><th>${t("employee")}</th><th>${t("gross")}</th><th>${t("deductions")}</th><th>${t("net")}</th></tr>
 ${r.lines.map((l) => `<tr><td>${esc(l.name)}</td><td>${fmt(l.basic + l.allow)}</td><td>${fmt(l.ins + l.tax)}</td><td>${fmt(l.net)}</td></tr>`).join("")}</table></div>`,
              )
              .join("") || `<div class="card mut">${t("noData")}</div>`
          );
        },
      };
      PG.equity_report = {
        k: "equity_report",
        f() {
          const eq = accs().filter((a) => a.lv === "d" && a.type === "equity");
          const np = r2(typeSum("revenue") - typeSum("expense"));
          return `<div class="card"><table class="tb2"><tr><th>${t("account")}</th><th>${t("balance")}</th></tr>
 ${eq.map((a) => `<tr><td>${a.code} ${esc(LANG === "ar" ? a.name : a.en)}</td><td>${money(accBal(a.code))}</td></tr>`).join("")}
 <tr style="font-weight:800"><td>${t("netProfit")}</td><td>${money(np)}</td></tr>
 <tr style="font-weight:800;background:#f0fdfa"><td>${t("equityTotal")}</td><td>${money(r2(typeSum("equity") + np))}</td></tr></table></div>`;
        },
      };

      /* ---------- Manufacturing ---------- */
      PG.manufacturing = {
        k: "manufacturing",
        f() {
          const boms = DB.g("boms", []),
            prods = DB.g("production", []).slice().reverse(),
            inv = DB.g("inv", []);
          return `<div class="row" style="margin-bottom:10px"><button class="btn btnP" onclick="bomNew()">➕ ${t("bom")}</button><button class="btn btnS" onclick="prodNew()">➕ ${t("production")}</button></div>
 <div class="card"><h3>${t("bom")}</h3><table class="tb2"><tr><th>${t("code")}</th><th>${t("finished")}</th><th>${t("components")}</th><th></th></tr>
 ${boms.map((b) => `<tr><td>${b.id}</td><td>${esc((inv.find((i) => i.id === b.fin) || {}).name || "")}</td><td>${b.lines.map((l) => `${esc((inv.find((i) => i.id === l.invId) || {}).name || "")} ×${l.qty}`).join("، ")}</td><td><button class="btn sm btnD" onclick="bomDel('${b.id}')">🗑</button></td></tr>`).join("") || `<tr><td colspan=4 class="mut">${t("noData")}</td></tr>`}</table></div>
 <div class="card"><h3>${t("production")}</h3><table class="tb2"><tr><th>${t("code")}</th><th>${t("bom")}</th><th>${t("prodQty")}</th><th>${t("status")}</th><th></th></tr>
 ${
   prods
     .map(
       (
         p,
       ) => `<tr><td>${p.id}</td><td>${p.bomId}</td><td>${p.qty}</td><td>${p.status === "done" ? `<span class="bdg g">${t("done")}</span>` : `<span class="bdg y">${t("pending")}</span>`}</td>
 <td>${p.status !== "done" ? `<button class="btn sm btnS" onclick="prodExec('${p.id}')">⚙️ ${t("exec")}</button> ` : ""}<button class="btn sm btnD" onclick="prodDel('${p.id}')">🗑</button></td></tr>`,
     )
     .join("") || `<tr><td colspan=5 class="mut">${t("noData")}</td></tr>`
 }</table></div>`;
        },
      };
      let bomRows = 1;
      function bomNew() {
        const inv = DB.g("inv", []);
        bomRows = 1;
        modal(
          t("bom"),
          `<div class="fld"><label>${t("finished")}</label><select id="bmF">${inv.map((i) => `<option value="${i.id}">${esc(i.name)}</option>`).join("")}</select></div>
 <table class="tb2" style="margin-top:8px"><tr><th>${t("components")}</th><th>${t("qty")}</th></tr><tbody id="bmB">
 <tr><td><select id="bmI0">${inv.map((i) => `<option value="${i.id}">${esc(i.name)}</option>`).join("")}</select></td><td><input type="number" id="bmQ0" value="1" style="width:80px"></td></tr></tbody></table>
 <button class="btn" style="margin-top:8px" onclick="const d=document.createElement('tr');d.innerHTML='<td><select id=\\'bmI'+bomRows+'\\'>${inv.map((i) => `<option value='${i.id}'>${esc(i.name).replace(/'/g, "")}</option>`).join("")}</select></td><td><input type=number id=\\'bmQ'+bomRows+'\\' value=1 style=width:80px></td>';q('bmB').appendChild(d);bomRows++">${t("addLine")}</button>`,
          `<button class="btn btnP" onclick="bomSave()">${t("save")}</button><button class="btn" onclick="xM()">${t("cancel")}</button>`,
        );
      }
      function bomSave() {
        const lines = [];
        for (let i = 0; i < bomRows; i++) {
          const e = q("bmI" + i);
          if (e) lines.push({ invId: e.value, qty: +q("bmQ" + i).value || 1 });
        }
        const l = DB.g("boms", []);
        l.push({ id: nextId("BOM-", l, 3), fin: q("bmF").value, lines });
        DB.s("boms", l);
        xM();
        toast(t("saved"));
        renderPage();
      }
      function bomDel(id) {
        if (!confirm(t("confirmDel"))) return;
        DB.s(
          "boms",
          DB.g("boms", []).filter((x) => x.id !== id),
        );
        renderPage();
      }
      function prodNew() {
        const boms = DB.g("boms", []);
        if (!boms.length) return toast(t("noData"), 1);
        modal(
          t("production"),
          `<div class="frm"><div class="fld"><label>${t("bom")}</label><select id="pdB">${boms.map((b) => `<option value="${b.id}">${b.id}</option>`).join("")}</select></div>
 <div class="fld"><label>${t("prodQty")}</label><input type="number" id="pdQ" value="1"></div></div>`,
          `<button class="btn btnP" onclick="prodSave()">${t("save")}</button><button class="btn" onclick="xM()">${t("cancel")}</button>`,
        );
      }
      function prodSave() {
        const l = DB.g("production", []);
        l.push({
          id: nextId("PRD-", l, 4),
          bomId: q("pdB").value,
          qty: +q("pdQ").value,
          status: "open",
        });
        DB.s("production", l);
        xM();
        toast(t("saved"));
        renderPage();
      }
      function prodExec(id) {
        const l = DB.g("production", []),
          p = l.find((x) => x.id === id),
          bom = DB.g("boms", []).find((b) => b.id === p.bomId),
          inv = DB.g("inv", []);
        if (!bom) return;
        for (const c of bom.lines) {
          const it = inv.find((i) => i.id === c.invId);
          if (!it || it.qty < c.qty * p.qty)
            return toast("❌ " + t("lowStock") + ": " + it.name, 1);
        }
        bom.lines.forEach((c) => {
          inv.find((i) => i.id === c.invId).qty = r2(
            inv.find((i) => i.id === c.invId).qty - c.qty * p.qty,
          );
        });
        const fin = inv.find((i) => i.id === bom.fin);
        if (fin) fin.qty = r2(fin.qty + p.qty);
        DB.s("inv", inv);
        p.status = "done";
        DB.s("production", l);
        toast("✅ " + t("done"));
        renderPage();
      }
      function prodDel(id) {
        if (!confirm(t("confirmDel"))) return;
        DB.s(
          "production",
          DB.g("production", []).filter((x) => x.id !== id),
        );
        renderPage();
      }

      /* ---------- Settings ---------- */
      let setTab = "company";
      PG.settings = {
        k: "settings",
        f() {
          const c = comp();
          let body = "";
          if (setTab === "company") {
            body = `<div class="frm">
 <div class="fld"><label>${t("companyName")}</label><input id="cN" value="${esc(c.name || "")}"></div>
 <div class="fld"><label>${t("address")}</label><input id="cAd" value="${esc(c.address || "")}"></div>
 <div class="fld"><label>${t("vatNo")}</label><input id="cV" value="${esc(c.vatNo || "")}"></div>
 <div class="fld"><label>${t("crNo")}</label><input id="cCR" value="${esc(c.crNo || "")}"></div>
 <div class="fld"><label>${t("phone")}</label><input id="cP" value="${esc(c.phone || "")}"></div>
 <div class="fld"><label>${t("fiscalYear")}</label><input id="cFY" value="${esc(c.fiscalYear || "")}"></div>
 <div class="fld"><label>${t("currency")}</label><select id="cCur">${WORLD_CURRENCIES.map((x) => `<option ${x[0] === c.currency ? "selected" : ""} value="${x[0]}">${x[0]} — ${x[2]}</option>`).join("")}</select></div>
 <div class="fld"><label>${t("country")}</label><select id="cCty" onchange="const p=COUNTRIES.find(x=>x[0]===this.value);if(p){q('cVR').value=p[2]}">${COUNTRIES.map((x) => `<option ${x[0] === c.country ? "selected" : ""} value="${x[0]}">${countryName(x)}</option>`).join("")}</select></div>
 <div class="fld"><label>${t("vatRate")}</label><input type="number" step="0.01" id="cVR" value="${c.vatRate ?? 15}"></div>
 <div class="fld"><label>${t("socialRate")}</label><input type="number" step="0.01" id="cIR" value="${c.insRate ?? 10}"></div></div>
 <div style="margin-top:10px"><button class="btn btnP" onclick="cSave()">${t("save")}</button></div>`;
          } else if (setTab === "users") {
            const users = DB.g("users", []);
            body = `<div class="row" style="margin-bottom:10px"><button class="btn btnP" onclick="uNew()">${t("newUser")}</button></div>
  <table class="tb2"><tr><th>${t("name")}</th><th>${t("email")}</th><th>${t("role")}</th><th>${t("actions")}</th></tr>
  ${users.map((u) => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${roleLbl(u.role)}</td><td><button class="btn sm" onclick="uEdit('${u.id}')">✏️</button> <button class="btn sm btnD" onclick="uDel('${u.id}')">🗑</button></td></tr>`).join("")}</table>`;
          } else if (setTab === "profile") {
            body = `<div class="frm"><div class="fld"><label>${t("name")}</label><input id="pfN" value="${esc(S.user.name)}"></div>
 <div class="fld"><label>${t("password")}</label><input id="pfP" value="${esc(S.user.password)}"></div></div>
 <div style="margin-top:10px"><button class="btn btnP" onclick="pfSave()">${t("save")}</button></div>`;
          } else {
            body = `<div class="row"><button class="btn btnS" onclick="expJSON()">${t("exportData")}</button>
 <button class="btn btnD" onclick="if(confirm(t('confirmDel'))){const p=pfx();Object.keys(localStorage).filter(k=>k.startsWith(p)).forEach(k=>localStorage.removeItem(k));location.reload()}">⚠️ ${t("resetDemo")}</button></div>
 <div class="hint" style="margin-top:12px">⚠️ Prototype: ${LANG === "ar" ? "كلمات المرور غير مشفرة والصلاحيات تُقيَّم في المتصفح فقط — راجع قسم المتطلبات غير الوظيفية (§9) في وثيقة المواصفات قبل الإنتاج." : "Passwords are unhashed and permissions are client-side only — see spec §9 before production."}</div>`;
          }
          return `<div class="tabs"><a class="${setTab === "company" ? "on" : ""}" onclick="setTab='company';renderPage()">${t("companyTab")}</a>
 <a class="${setTab === "users" ? "on" : ""}" onclick="setTab='users';renderPage()">${t("usersTab")}</a>
 <a class="${setTab === "profile" ? "on" : ""}" onclick="setTab='profile';renderPage()">${t("profile")}</a>
 <a class="${setTab === "system" ? "on" : ""}" onclick="setTab='system';renderPage()">${t("systemTab")}</a></div><div class="card">${body}</div>`;
        },
      };
      function cSave() {
        saveComp({
          ...comp(),
          name: q("cN").value,
          address: q("cAd").value,
          vatNo: q("cV").value,
          crNo: q("cCR").value,
          phone: q("cP").value,
          fiscalYear: q("cFY").value,
          currency: q("cCur").value,
          country: q("cCty").value,
          vatRate: +q("cVR").value,
          insRate: +q("cIR").value,
        });
        toast(t("saved"));
        drawShell();
      }
      function uNew() {
        modal(
          t("newUser"),
          uForm(),
          `<button class="btn btnP" onclick="uSave()">${t("save")}</button><button class="btn" onclick="xM()">${t("cancel")}</button>`,
        );
      }
      function uForm(u = {}) {
        return `<div class="frm">
 <div class="fld"><label>${t("name")}</label><input id="uN" value="${esc(u.name || "")}"></div>
 <div class="fld"><label>${t("email")}</label><input id="uE" value="${esc(u.email || "")}"></div>
 <div class="fld"><label>${t("password")}</label><input id="uP" value="${esc(u.password || "")}"></div>
 <div class="fld"><label>${t("role")}</label><select id="uR" onchange="uApplyRole(this.value)">${Object.keys(
   ROLES,
 )
   .map(
     (r) =>
       `<option value="${r}" ${u.role === r ? "selected" : ""}>${roleLbl(r)}</option>`,
   )
   .join("")}</select></div>
 <div class="fld fw"><label>${t("perms")} <a onclick="uApplyRole(q('uR').value)">— ${t("applyRole")}</a></label>
 <div class="permGrid">${ALL_PERMS.map((p) => `<label><input type="checkbox" class="uPerm" value="${p}" ${(u.perms || ROLES[u.role || "viewer"].perms).includes(p) ? "checked" : ""}> ${t(p)}</label>`).join("")}</div></div></div>`;
      }
      function uApplyRole(r) {
        const perms = (ROLES[r] || {}).perms || [];
        document
          .querySelectorAll(".uPerm")
          .forEach((c) => (c.checked = perms.includes(c.value)));
      }
      function uSave(id) {
        const perms = [...document.querySelectorAll(".uPerm:checked")].map(
          (c) => c.value,
        );
        const l = DB.g("users", []);
        if (id) {
          const u = l.find((x) => x.id === id);
          Object.assign(u, {
            name: q("uN").value,
            email: q("uE").value,
            password: q("uP").value,
            role: q("uR").value,
            perms,
          });
        } else
          l.push({
            id: "U" + (l.length + 1),
            name: q("uN").value,
            email: q("uE").value,
            password: q("uP").value,
            role: q("uR").value,
            color: "#0f766e",
            companyCode: S.company.code,
            created: today(),
            perms,
          });
        DB.s("users", l);
        xM();
        toast(t("saved"));
        renderPage();
      }
      function uEdit(id) {
        const u = DB.g("users", []).find((x) => x.id === id);
        modal(
          "✏️ " + esc(u.name),
          uForm(u),
          `<button class="btn btnP" onclick="uSave('${id}')">${t("save")}</button><button class="btn" onclick="xM()">${t("cancel")}</button>`,
        );
      }
      function uDel(id) {
        if (id === S.user.id) return toast(t("denied"), 1);
        if (!confirm(t("confirmDel"))) return;
        DB.s(
          "users",
          DB.g("users", []).filter((x) => x.id !== id),
        );
        renderPage();
      }
      function pfSave() {
        S.user.name = q("pfN").value;
        S.user.password = q("pfP").value;
        const l = DB.g("users", []);
        Object.assign(
          l.find((u) => u.id === S.user.id),
          { name: S.user.name, password: S.user.password },
        );
        DB.s("users", l);
        toast(t("saved"));
        drawShell();
      }
      function expJSON() {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([JSON.stringify(DB.exportAll(), null, 2)], {
            type: "application/json",
          }),
        );
        a.download = "aman_backup_" + S.company.code + ".json";
        a.click();
        toast("⬇️ " + t("dataExported"));
      }

      /* ---------------- Init ---------------- */
      applyLangDir();
      (async function () {
        if (window.amanDesktop) {
          await runAutoMigrationToRealm();
        }
        const sess = sessionStorage.getItem("ge_sess");
        if (sess) {
          try {
            const { code, uid } = JSON.parse(sess);
            S.company = { code };
            const u = DB.g("users", []).find((x) => x.id === uid);
            if (u) {
              enter(code, uid);
              return;
            }
          } catch (e) {}
        }
        q("app").innerHTML = authHTML();
      })();
    </script>
  </body>
</html>
